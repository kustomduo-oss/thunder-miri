<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 동네 레이더 — 동탄이네 천둥번개 알림이</title>
<meta name="description" content="우리 동네 주변의 비구름과 낙뢰를 지도에서 확인하세요. 기상청 레이더 자료를 5분마다 갱신합니다." />
<link rel="stylesheet" href="style.css?v=signal-5" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  .radar-wrap{max-width:var(--wrap);margin:0 auto;padding:0 18px}
  .map-wrap{position:relative}
  #map{height:min(70vh,560px);border-radius:16px;border:1px solid var(--line);
       box-shadow:0 8px 24px rgba(30,58,138,.08);background:#dfe8f0}
  /* 배경지도 채도를 낮춰 강수 색이 도드라지게 (오버레이·마커는 그대로) */
  .leaflet-tile-pane{filter:saturate(.75)}
  .basemap-switch{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:4px;
       background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:3px;
       box-shadow:0 2px 8px rgba(0,0,0,.14)}
  .basemap-switch button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;
       color:var(--ink-soft);padding:5px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .basemap-switch button[aria-pressed="true"]{background:var(--navy,#1e3a8a);color:#fff}
  @media (max-width:520px){ .basemap-switch button{font-size:11px;padding:5px 7px} }
  .radar-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:14px 0 10px}
  .radar-bar .obs{font-size:14px;color:var(--ink-soft)}
  .radar-bar .obs b{color:var(--ink)}
  .legend{display:flex;align-items:center;gap:0;font-size:11px;color:var(--ink-soft)}
  .legend i{width:26px;height:11px;display:inline-block}
  .legend span{margin:0 6px}
  .radar-note{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:12px 0 0}
  .radar-empty{background:#eef6ff;border:1px solid #cfe2ff;border-radius:12px;
       padding:13px 15px;font-size:14px;margin:12px 0 0}
  .leaflet-container{font:inherit}
  .home-dot{background:#1e3a8a;border:3px solid #fff;border-radius:50%;
       box-shadow:0 2px 8px rgba(0,0,0,.35)}

  /* 예측 그림 (예측 구간에서만 표시) */
  .fc-stage{position:relative;background:#f4f7fb;border:1px solid var(--line);
       border-radius:16px;overflow:hidden;margin-top:0}
  .fc-stage img{display:block;width:100%;height:auto}
  .fc-btn{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;
       background:var(--navy,#1e3a8a);color:#fff;font-size:16px;cursor:pointer;
       display:grid;place-items:center;box-shadow:0 4px 12px rgba(30,58,138,.25)}
  .fc-btn:active{transform:translateY(1px)}
  .fc-time{flex:0 0 auto;min-width:120px;text-align:right;font-size:14px;font-weight:700;color:var(--ink)}

  /* 통합 타임바 */
  .tl{display:flex;align-items:center;gap:12px;margin-top:14px}
  .tl-main{flex:1;min-width:0}
  #tlRange{width:100%;accent-color:var(--navy,#1e3a8a);cursor:pointer;margin:0}
  .tl-marks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:2px}
  .tl-marks #tlNowMark{font-weight:800;color:var(--navy,#1e3a8a)}
  .tl-kind{font-size:13px;color:var(--ink-soft);margin:8px 0 0}
  .tl-kind b{color:var(--navy,#1e3a8a)}
  @media (max-width:520px){ .fc-time{min-width:98px;font-size:13px} .tl-marks{font-size:10px} }
  .bolt-dot{background:#ffd54a;border:2px solid #b8860b;border-radius:50%;
       box-shadow:0 0 6px rgba(255,213,74,.9)}
</style>
</head>
<body>
<main>
  <span class="tag">우리 동네 레이더</span>
  <h1 class="page-title">지금 비구름이 어디쯤 왔나</h1>
  <p class="page-sub">기상청 레이더 자료를 5분마다 받아 우리 동네 주변만 보여드립니다. 낙뢰가 관측되면 지도에 함께 표시됩니다.</p>

  <div class="radar-wrap" style="padding:0">
    <div class="radar-bar">
      <div class="obs">관측 시각 <b id="obsTime">불러오는 중…</b></div>
      <div class="legend" aria-label="강수 강도">
        <span>약함</span>
        <i style="background:#8ed1fc"></i><i style="background:#3aa0ff"></i><i style="background:#2ecc71"></i>
        <i style="background:#f1c40f"></i><i style="background:#e67e22"></i><i style="background:#e74c3c"></i>
        <span>강함</span>
      </div>
    </div>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="basemap-switch" role="group" aria-label="지도 스타일">
        <button type="button" data-base="Base">일반</button>
        <button type="button" data-base="white">밝게</button>
        <button type="button" data-base="midnight">어둡게</button>
      </div>
    </div>
    <div id="emptyMsg" class="radar-empty" style="display:none"></div>

    <!-- 과거 관측 → 지금 → 미래 예측을 하나로 잇는 타임바 -->
    <div class="tl">
      <button type="button" id="tlPlay" class="fc-btn" aria-label="재생">▶</button>
      <div class="tl-main">
        <input type="range" id="tlRange" min="0" max="0" value="0" aria-label="시각 선택" />
        <div class="tl-marks"><span>과거 관측</span><span id="tlNowMark">지금</span><span>예측 +6시간</span></div>
      </div>
      <span id="tlLabel" class="fc-time">—</span>
    </div>
    <p id="tlKind" class="tl-kind">—</p>

    <p class="radar-note">
      🔵 우리 집 · 원은 <b>50km(접근)</b>과 <b>30km(임박)</b> 알림 기준 거리입니다.
      ⚡ 노란 점은 <b>최근 관측된 낙뢰</b>입니다(예보가 아니라 이미 친 낙뢰).<br />
      자료: 기상청 레이더·낙뢰 관측 · 배경지도: 국토교통부 브이월드
    </p>

    <p style="margin:18px 0 0"><a class="btn" href="index.html">알림 받기 →</a></p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   우리 동네 레이더 화면
   - 발송 엔진(sender/radar.py)이 5분마다 만들어 올린
     PNG + 메타(JSON)를 읽어 지도에 겹쳐 보여준다.
   ============================================================ */
const CONFIG = {
  RADAR_BASE: "https://pdlohzenslwbiyoxwjom.supabase.co/storage/v1/object/public/radar",
  VWORLD_KEY: "12A21CCD-E7FC-3E4E-B6A5-F8DE7A32A24D",  // 도메인 잠금 키(공개 안전)
  DEFAULT_GRID: "69_106",   // 아직 위치를 모를 때 기본(청주)
};

const $ = (id) => document.getElementById(id);

/* 가입 때 저장해둔 우리 동네 격자가 있으면 그걸 쓴다 */
function myGrid() {
  const q = new URLSearchParams(location.search).get("grid");
  if (q) return q;
  try {
    const saved = localStorage.getItem("thunder_grid");
    if (saved) return saved;
  } catch (e) {}
  return CONFIG.DEFAULT_GRID;
}

const map = L.map("map", { zoomControl: true, attributionControl: true });

/* 배경지도: 브이월드(국토교통부).
   비 색깔과 지도 색이 겹치지 않도록 '밝게(white)'를 기본으로 쓴다.
   브이월드가 안 되면 OpenStreetMap으로 자동 전환.                     */
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "© OpenStreetMap 기여자",
});
let baseLayer = null, fellBack = false;

function setBasemap(type) {
  try { localStorage.setItem("thunder_basemap", type); } catch (e) {}
  document.querySelectorAll(".basemap-switch button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.base === type)));
  if (fellBack) return;                       // OSM으로 넘어간 상태면 그대로 둔다
  if (baseLayer) map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(
    `https://api.vworld.kr/req/wmts/1.0.0/${CONFIG.VWORLD_KEY}/${type}/{z}/{y}/{x}.png`,
    { maxZoom: 18, attribution: "배경지도 © 국토교통부 브이월드" }
  );
  baseLayer.on("tileerror", () => {
    if (fellBack) return;
    fellBack = true;
    console.warn("브이월드 타일 실패 → OpenStreetMap으로 전환");
    if (baseLayer) map.removeLayer(baseLayer);
    osm.addTo(map);
  });
  baseLayer.addTo(map);
  if (map.getPane("tilePane")) baseLayer.setZIndex(1);
}

let savedBase = "Base";
try { savedBase = localStorage.getItem("thunder_basemap") || "Base"; } catch (e) {}
setBasemap(savedBase);
document.querySelectorAll(".basemap-switch button").forEach((b) =>
  b.addEventListener("click", () => setBasemap(b.dataset.base)));

const dot = (cls, size) =>
  L.divIcon({ className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2],
              html: `<div class="${cls}" style="width:${size}px;height:${size}px"></div>` });

let overlay = null;
let lastObsMeta = null, lastFcMeta = null;
const strikeLayer = L.layerGroup().addTo(map);

async function load() {
  const grid = myGrid();
  let meta;
  try {
    const res = await fetch(`${CONFIG.RADAR_BASE}/${grid}.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    meta = await res.json();
  } catch (e) {
    console.warn("레이더 정보를 불러오지 못했습니다:", e);
    $("obsTime").textContent = "불러오기 실패";
    $("emptyMsg").style.display = "block";
    $("emptyMsg").innerHTML =
      "아직 이 동네의 레이더 화면이 준비되지 않았어요. 알림에 가입하면 우리 동네 화면이 만들어집니다.";
    map.setView([36.6139, 127.5127], 9);
    return;
  }

  lastObsMeta = meta;
  const home = [meta.home.lat, meta.home.lon];
  if (!map._loadedOnce) { map.setView(home, 7); map._loadedOnce = true; }   // 넓게 시작

  /* 레이더 이미지를 실제 위경도 범위에 맞춰 얹기 */
  const b = meta.bounds;
  if (overlay) map.removeLayer(overlay);
  overlay = L.imageOverlay(`${meta.image}?t=${Date.now()}`,
    [[b.south, b.west], [b.north, b.east]], { opacity: 0.82 }).addTo(map);

  /* 우리 집 + 알림 기준 반경 */
  L.marker(home, { icon: dot("home-dot", 16), title: "우리 집" }).addTo(map);
  L.circle(home, { radius: 50000, color: "#1e3a8a", weight: 1.2, fill: false, dashArray: "5,6" }).addTo(map);
  L.circle(home, { radius: 30000, color: "#e74c3c", weight: 1.4, fill: false, dashArray: "5,6" }).addTo(map);

  /* 최근 낙뢰 */
  strikeLayer.clearLayers();
  (meta.lightning || []).forEach((s) =>
    L.marker([s.lat, s.lon], { icon: dot("bolt-dot", 9), title: "최근 관측된 낙뢰" }).addTo(strikeLayer)
  );

  const obs = new Date(meta.observed_at);
  const mins = Math.max(0, Math.round((Date.now() - obs.getTime()) / 60000));
  $("obsTime").textContent =
    `${String(obs.getHours()).padStart(2, "0")}:${String(obs.getMinutes()).padStart(2, "0")} (${mins}분 전)`;

  /* 상황을 정직하게 알려준다.
     비가 아주 미미하면 화면상 거의 안 보이므로, 고장이 아님을 명시한다. */
  const empty = $("emptyMsg");
  const cells = meta.rain_cells || 0;
  const total = meta.total_cells || 1;
  const ratio = cells / total;              // 화면에서 비가 차지하는 비율
  const maxDbz = meta.max_dbz;
  const strikes = (meta.lightning || []).length;

  empty.style.display = "block";
  if (!cells && !strikes) {
    empty.innerHTML = "지금 우리 동네 주변에는 <b>비구름과 낙뢰가 없습니다.</b> 비가 오면 이 지도에 표시돼요.";
  } else if (ratio < 0.01 && (maxDbz === null || maxDbz < 20) && !strikes) {
    empty.innerHTML =
      "지금은 <b>아주 약한 비구름만 조금</b> 있어요" +
      (maxDbz !== null ? ` (최대 ${maxDbz} dBZ)` : "") +
      ". 지도에는 거의 보이지 않을 수 있습니다 — 고장이 아니에요.";
  } else {
    empty.style.display = "none";
  }
}

/* ── 통합 타임바 ────────────────────────────────────
   과거 관측(우리 동네 지도 위 레이더) → 지금 → 미래 예측(기상청 그림)을
   하나의 슬라이더로 잇는다.
   · 관측 구간: 지도 위 오버레이 이미지를 바꾼다
   · 예측 구간: 기상청이 완성해 준 예측 그림을 보여준다
     (예측 자료는 지도가 그려진 완성 이미지라 지도에 겹칠 수 없어 별도로 표시) */
let timeline = [];       // {kind:'obs'|'fcst', at:Date, image, ef}
let tlIdx = 0, tlTimer = null, nowIdx = 0;

function fmtClock(d) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function fmtGap(mins) {
  const a = Math.abs(mins);
  const s = a >= 60 ? `${Math.floor(a / 60)}시간${a % 60 ? " " + (a % 60) + "분" : ""}` : `${a}분`;
  if (a < 3) return "지금";
  return mins < 0 ? `${s} 전` : `${s} 뒤`;
}

function tlShow(i) {
  if (!timeline.length) return;
  tlIdx = (i + timeline.length) % timeline.length;
  const f = timeline[tlIdx];
  $("tlRange").value = tlIdx;

  const gap = Math.round((f.at.getTime() - Date.now()) / 60000);
  $("tlLabel").textContent = `${fmtClock(f.at)} (${fmtGap(gap)})`;

  /* 관측·예측 모두 같은 지도 위 오버레이라 프레임만 갈아끼우면 된다 */
  if (overlay) {
    if (f.bounds) overlay.setBounds([[f.bounds.south, f.bounds.west], [f.bounds.north, f.bounds.east]]);
    overlay.setUrl(f.image);
  }
  if (f.kind === "obs") {
    $("tlKind").innerHTML = "<b>관측</b> · 실제로 내린 비입니다.";
  } else if (f.rain_px === 0) {
    // 비가 없어 화면이 비는 경우, 고장으로 오해하지 않게 알려준다
    $("tlKind").innerHTML = "<b>예측</b> · 이 시각엔 이 지역에 <b>예보된 비가 없습니다.</b>";
  } else {
    $("tlKind").innerHTML = "<b>예측</b> · 기상청 초단기 강수예측(앞으로 올 비)입니다.";
  }
}

function tlStop() { clearInterval(tlTimer); tlTimer = null; $("tlPlay").textContent = "▶"; }
function tlToggle() {
  if (tlTimer) return tlStop();
  $("tlPlay").textContent = "❚❚";
  if (tlIdx >= timeline.length - 1) tlIdx = 0;
  tlTimer = setInterval(() => {
    if (tlIdx >= timeline.length - 1) { tlShow(0); } else { tlShow(tlIdx + 1); }
  }, 900);
}
$("tlPlay").addEventListener("click", tlToggle);
$("tlRange").addEventListener("input", (e) => { tlStop(); tlShow(+e.target.value); });

/* 관측 목록(meta.past)과 예측 목록(forecast.json)을 하나로 합친다 */
function buildTimeline(obsMeta, fcMeta) {
  const items = [];

  (obsMeta?.past || []).forEach((p) => {
    const s = p.stamp;   // YYYYMMDDHHMM
    const at = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12));
    items.push({ kind: "obs", at, image: p.image, bounds: obsMeta.bounds });
  });
  if (!items.length && obsMeta) {
    items.push({ kind: "obs", at: new Date(obsMeta.observed_at), image: obsMeta.image, bounds: obsMeta.bounds });
  }
  nowIdx = Math.max(0, items.length - 1);

  (fcMeta?.frames || []).forEach((f) => {
    items.push({ kind: "fcst", at: new Date(f.valid_at), image: f.image, ef: f.ef,
                 bounds: fcMeta.bounds, rain_px: f.rain_px });
  });

  items.sort((a, b) => a.at - b.at);
  timeline = items;
  nowIdx = Math.max(0, timeline.findIndex((f) => f.kind === "fcst") - 1);
  if (nowIdx < 0) nowIdx = timeline.length - 1;

  $("tlRange").max = Math.max(0, timeline.length - 1);
  $("tlNowMark").textContent = timeline.length ? `지금 ${fmtClock(timeline[nowIdx].at)}` : "지금";
  timeline.forEach((f) => { const im = new Image(); im.src = f.image; });   // 미리 받아두기
  tlShow(nowIdx);   // 기본은 '지금'
}

async function loadForecast() {
  try {
    const res = await fetch(`${CONFIG.RADAR_BASE}/${myGrid()}_forecast.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    lastFcMeta = await res.json();
  } catch (e) {
    console.warn("예측 자료를 불러오지 못했습니다:", e);
    lastFcMeta = null;
  }
  buildTimeline(lastObsMeta, lastFcMeta);
}

(async () => { await load(); await loadForecast(); })();
setInterval(async () => { await load(); await loadForecast(); }, 5 * 60 * 1000);
</script>
<script src="nav.js?v=brand-2" defer></script>
</body>
</html>
