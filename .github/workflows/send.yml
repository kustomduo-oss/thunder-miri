name: thunder-miri-sender

on:
  # 정기 실행은 cron-job.org에서 workflow_dispatch API를 5분마다 호출합니다.
  # GitHub 내장 schedule을 함께 사용하면 중복 발송될 수 있으므로 두지 않습니다.
  workflow_dispatch:          # 버튼 또는 cron-job.org에서 실행 (mode 선택 가능)
    inputs:
      mode:
        description: "once=실제 천둥감지, test=전 구독자에 테스트 푸시"
        type: choice
        options: [once, test]
        default: once

# cron-job.org 요청이나 수동 실행이 겹치더라도 발송 엔진은 한 번만 실행합니다.
# 레이더 이미지 생성은 radar.yml로 분리해 푸시 확인 주기를 방해하지 않습니다.
concurrency:
  group: thunder-miri-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r sender/requirements.txt
      - name: run sender
        run: python sender/sender.py --${{ inputs.mode || 'once' }}
        env:
          TZ: Asia/Seoul
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 발송 스텝이 죽으면(파이썬이 경보를 보내기 전에 죽은 경우 포함) 여기서 알린다.
      # 관리자에게만 가는 텔레그램이며, 사용자 알림과는 무관하다.
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 미설정 — 경보 건너뜀"; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=[썬더미리] 🚨 발송 워크플로우 실패. 천둥이 쳐도 알림이 안 갈 수 있습니다.
          로그: ${RUN_URL}" > /dev/null
