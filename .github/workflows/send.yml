name: thunder-miri-sender

on:
  # 정기 실행은 cron-job.org에서 workflow_dispatch API를 5분마다 호출합니다.
  # GitHub 내장 schedule을 함께 사용하면 중복 발송될 수 있으므로 두지 않습니다.
  workflow_dispatch:          # 버튼 또는 cron-job.org에서 실행 (mode 선택 가능)
    inputs:
      mode:
        description: "once=실제 천둥감지, test=전 구독자에 테스트 푸시"
        type: choice
        options: [once, test]
        default: once

# cron-job.org 요청이나 수동 실행이 겹치더라도 발송 엔진은 한 번만 실행합니다.
concurrency:
  group: thunder-miri-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r sender/requirements.txt
      - name: run sender
        run: python sender/sender.py --${{ inputs.mode || 'once' }}
        env:
          TZ: Asia/Seoul
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      # 레이더 화면용 이미지 생성 (실패해도 알림 발송에는 영향 없게 continue-on-error)
      - name: build radar images
        if: ${{ inputs.mode != 'test' }}
        continue-on-error: true
        run: python sender/radar.py
        env:
          TZ: Asia/Seoul   # 발송 서버를 한국시간으로 (UTC면 기상청 예보 시각이 9시간 어긋남)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
