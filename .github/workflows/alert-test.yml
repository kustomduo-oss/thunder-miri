# 경보 장치가 실제로 울리는지 확인하는 일회용 워크플로우. 검증이 끝나면 삭제한다.
name: thunder-miri-alert-test

on:
  workflow_dispatch:
    inputs:
      case:
        description: "kma=기상청 조회 실패 경보 / crash=워크플로우 실패 경보"
        type: choice
        options: [kma, crash]
        default: kma

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r sender/requirements.txt

      # 기상청 키를 일부러 틀리게 넣어 조회 실패를 만든다.
      # sender.py가 이 상황을 '낙뢰 없음'이 아니라 '실패'로 다루는지 확인하는 것이 목적.
      - name: 실패 상황 재현
        run: |
          if [ "${{ inputs.case }}" = "crash" ]; then
            python -c "raise RuntimeError('경보 테스트: 일부러 낸 오류')"
          else
            python sender/sender.py --once
          fi
        env:
          TZ: Asia/Seoul
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KMA_API_KEY: ${{ inputs.case == 'kma' && 'INVALID_KEY_FOR_ALERT_TEST' || secrets.KMA_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=[썬더미리] 🧪 경보 테스트 — 워크플로우 실패 알림입니다. 실제 장애가 아닙니다.
          로그: ${RUN_URL}" > /dev/null
